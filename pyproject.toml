[project]
name = "tbs-social"
version = "0.1.0"
description = "Social media content management and monitoring for The Back Space"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.15",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tbs-social = "tbs_social.cli:main"

[tool.setuptools]
packages = ["tbs_social", "tbs_social.platforms"]

[tool.setuptools.package-data]
tbs_social = ["templates/*.html"]
