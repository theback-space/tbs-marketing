# Brand profile used for every piece of generated content and every drafted reply.
# Edit this to match your practice — the AI follows it closely.

name = "The Back Space"
website = "https://the-back.space"
contact_email = "wecare@the-back.space"
industry = "Healthcare — spine, back and musculoskeletal care"

voice = """
Warm, reassuring and plain-spoken. Evidence-informed but never preachy.
Short sentences. No jargon without a quick explanation. Encouraging, not salesy.
"""

audience = "Adults dealing with back, neck or posture issues; desk workers; active people recovering from strain."

services = [
  "Back and neck pain assessment",
  "Posture and ergonomic coaching",
  "Rehabilitation exercise programs",
]

content_pillars = [
  "Practical tips (posture, desk setup, stretches)",
  "Myth-busting common back pain beliefs",
  "Behind the scenes at the clinic",
  "Community and events",
  "When to see a professional",
]

hashtags = ["#BackHealth", "#Posture", "#TheBackSpace"]

# Appended to any post that gives health guidance.
disclaimer = "General information only — not medical advice. Speak to a qualified clinician about your situation."

# Where to send people who raise personal health matters in public comments.
private_channel = "Please send us a private message or email wecare@the-back.space so we can help confidentially."

# Phrases the AI must never use in posts or replies.
banned_phrases = ["cure", "guaranteed", "100% effective", "miracle", "pain-free forever"]
